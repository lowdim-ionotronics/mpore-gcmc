[project]
name = "mpore-gcmc"
version = "2.0"
description = "GCMC simulation of ions in cylindrical/slit metallic pores using mplib"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mpore_gcmc"]
